<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA store</title>
  <meta name="description" content="Search the stock store. Add with ooda add NAME.">
  <link rel="icon" href="https://openooda.org/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="openOODA store">
  <meta property="og:description" content="Search the stock store. Add with ooda add NAME.">
  <meta property="og:url" content="https://registry.openooda.org/">
  <meta property="og:image" content="https://openooda.org/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var t = (m && m[1] === "dark") || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme") === "dark") ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #fff; --fg: #000; --muted: #444; }
    html[data-theme="dark"] { --bg: #000; --fg: #e8e8e8; --muted: #9a9a9a; }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand-row { display: flex; align-items: baseline; gap: 0.45rem; }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .ver { font-size: 0.85rem; white-space: nowrap; }
    #theme, .copy {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    .copy {
      min-width: 6ch;
      text-align: center;
      box-sizing: content-box;
    }
    .copy.is-on {
      background: var(--fg);
      color: var(--bg);
    }
    .wrap { display: grid; grid-template-columns: 12rem 1fr; max-width: 60rem; }
    aside {
      border-right: 1px solid var(--fg); padding: 1.25rem 1rem 5rem;
      position: sticky; top: 3.4rem; align-self: start;
    }
    .global a { display: block; color: var(--fg); padding: 0.25rem 0; text-align: left; }
    .global a.active { text-decoration: underline; text-decoration-thickness: 2px; }
    main { padding: 1.5rem 1.25rem 5rem; max-width: 44rem; min-width: 0; }
    p { margin: 0 0 1.25rem; max-width: 36rem; }
    #q {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.2rem 0.45rem;
      width: 100%; max-width: 40rem; box-sizing: border-box;
      margin: 0 0 1.25rem;
    }
    table { border-collapse: collapse; width: 100%; max-width: 40rem; margin: 0 0 1.25rem; }
    th, td { border: 1px solid var(--fg); padding: 0.3rem 0.55rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 400; }
    td.lock { overflow-wrap: anywhere; word-break: break-all; }
    td.cmd { white-space: nowrap; }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    #gh { position: fixed; right: 1rem; bottom: 1rem; z-index: 20; color: var(--fg); background: var(--bg); padding: 0.15rem 0.35rem; }
    #skip {
      position: absolute; left: 0.5rem; top: 0.5rem; z-index: 30;
      background: var(--bg); color: var(--fg); padding: 0.15rem 0.45rem;
      clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden;
    }
    #skip:focus {
      clip-path: none; width: auto; height: auto; overflow: visible;
      outline: 2px solid var(--fg);
    }
    tr.hit { cursor: pointer; }
    td.add { white-space: nowrap; }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      aside { position: static; border-right: 0; border-bottom: 1px solid var(--fg); padding-bottom: 1rem; }
      #gh {
        position: static; display: block;
        margin-top: 0.75rem; padding: 0.75rem 0 0;
        border-top: 1px solid var(--fg);
      }
      #theme, .copy {
        min-height: 44px; padding: 0.55rem 0.85rem; box-sizing: border-box;
      }
      .global a {
        min-height: 44px; padding-top: 0.65rem; padding-bottom: 0.65rem; box-sizing: border-box;
      }
      #q { min-height: 44px; padding: 0.55rem 0.45rem; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      table { max-width: none; }
      tr.hit {
        border: 1px solid var(--fg);
        margin: 0 0 0.75rem;
        padding: 0.35rem 0;
      }
      th, td { border: 0; }
      td.add, td.cmd { white-space: normal; }
      td.cmd { padding-top: 0.5rem; }
      main { padding-bottom: 1.5rem; }
    }
    @media print {
      html, body { background: #fff; color: #000; }
      #skip, #gh, #theme, header, aside, .copy, #q { display: none !important; }
      .wrap { display: block; max-width: none; }
      main { padding: 0; max-width: none; }
      a { color: #000; }
    }
  </style>
</head>
<body>
  <a id="skip" href="https://openooda.org/guide/">guide</a>
  <header>
    <div class="brand-row">
      <a class="brand" href="https://openooda.org/">openOODA</a>
      <span class="ver">v0.205.0-beta</span>
    </div>
    <button type="button" id="theme">dark</button>
  </header>
  <div class="wrap">
    <aside>
      <nav class="global">
        <a href="https://openooda.org/">home</a>
        <a href="https://openooda.org/guide/">guide</a>
        <a class="active" href="https://registry.openooda.org/">store</a>
      </nav>
      <a id="gh" href="https://github.com/openOODA">github</a>
    </aside>
    <main>
      <noscript>
        <p>Stock store. After checkout install: <code>ooda add NAME</code>.</p>
        <p><a href="hello/hello.oo">hello@1.0.0#16c3ceb221e5a2818b340a66796a4a9db0c8a65b5c7bf36aeef285ef160608ce#FsRead</a><br><code>ooda add hello</code> pay=free</p>
        <p><a href="mid/mid.oo">mid@1.0.0#006ee56e6f99f683f3a4398e9f64b2a9eb22356adb0436f711d9444b6abf6c07#FsRead</a><br><code>ooda add mid</code> pay=free</p>
        <p><a href="world/world.oo">world@1.0.0#4b23f1b3227a7d15eb42f7e38d46c57fc26ba8619fe8dea1a4d9649e59182703#FsRead</a><br><code>ooda add world</code> pay=free</p>
        <p><a href="catalog">catalog</a></p>
      </noscript>
      <input id="q" type="search" placeholder="search" autocomplete="off" spellcheck="false">
      <p id="status">Loading…</p>
      <table id="hits" hidden>
        <thead>
          <tr><th>lock</th><th>add</th><th>note</th><th>pay</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>
  <script>
    (function () {
      var HIDE = { evilcap: true, tooyank: true };
      var yankedNames = {};
      var rows = [];
      var loaded = false;
      var q = document.getElementById("q");
      if (q) q.value = (function () {
        try { return new URL(location.href).searchParams.get("q") || ""; } catch (e) { return ""; }
      })();
      var status = document.getElementById("status");
      var table = document.getElementById("hits");
      var body = table.querySelector("tbody");

      function note(s) {
        status.textContent = s;
        status.hidden = !s;
      }

      function depLine(raw) {
        if (!raw) return "";
        var parts = raw.split(",");
        var names = [];
        var i = 0;
        while (i < parts.length) {
          var one = parts[i];
          var at = one.indexOf("@");
          var n = at >= 0 ? one.slice(0, at) : one;
          if (n) names.push(n);
          i = i + 1;
        }
        if (!names.length) return "";
        return "depends on " + names.join(", ");
      }

      function parseCatalog(text, yanked) {
        var out = [];
        var lines = text.split("\n");
        var i = 0;
        while (i < lines.length) {
          var line = lines[i];
          i = i + 1;
          if (!line) continue;
          var f = line.split("|");
          var name = f[0] || "";
          if (!name) continue;
          if (HIDE[name]) continue;
          if (yanked[name]) continue;
          var ver = f[1] || "";
          var caps = f[2] || "";
          var sha = f[4] || "";
          out.push({
            name: name,
            ver: ver,
            caps: caps,
            sha: sha,
            lock: name + "@" + ver + "#" + sha + "#" + caps,
            note: depLine(f[3] || ""),
            pay: "free",
            cmd: "ooda add " + name,
            src: name + "/" + name + ".oo"
          });
        }
        return out;
      }

      function parseYank(text) {
        var yanked = {};
        var lines = (text || "").split("\n");
        var i = 0;
        while (i < lines.length) {
          var line = lines[i];
          i = i + 1;
          if (!line) continue;
          var at = line.indexOf("@");
          var n = at >= 0 ? line.slice(0, at) : line;
          if (n) yanked[n] = true;
        }
        return yanked;
      }

      function match(row, s) {
        if (!s) return true;
        var hay = (row.name + " " + row.ver + " " + row.caps + " " + row.note + " " + row.sha + " " + row.lock + " " + (row.pay || "")).toLowerCase();
        return hay.indexOf(s.toLowerCase()) >= 0;
      }

      function queryFromUrl() {
        var raw = "";
        try { raw = new URL(location.href).searchParams.get("q") || ""; } catch (e) { raw = ""; }
        return raw.replace(/^\s+|\s+$/g, "");
      }

      function writeQuery(s) {
        var u;
        try { u = new URL(location.href); } catch (e) { return; }
        if (s) u.searchParams.set("q", s);
        else u.searchParams.delete("q");
        history.replaceState(null, "", u.pathname + u.search + u.hash);
      }

      function emptyLine(s) {
        if (!rows.length) return "empty";
        if (!s) return "empty";
        var key = s.toLowerCase();
        if (HIDE[key] || yankedNames[key]) return "yanked";
        return "no match";
      }

      function copyText(text, btn) {
        function ok() {
          btn.textContent = "copied";
          btn.classList.add("is-on");
        }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          var did = false;
          try { did = document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta);
          if (did) ok();
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok, fallback);
          return;
        }
        fallback();
      }

      function draw() {
        var s = q.value.replace(/^\s+|\s+$/g, "");
        var hits = [];
        var i = 0;
        while (i < rows.length) {
          if (match(rows[i], s)) hits.push(rows[i]);
          i = i + 1;
        }
        body.innerHTML = "";
        if (!hits.length) {
          table.hidden = true;
          note(loaded ? emptyLine(s) : "Loading…");
          return;
        }
        note("");
        table.hidden = false;
        i = 0;
        while (i < hits.length) {
          var r = hits[i];
          var tr = document.createElement("tr");
          tr.className = "hit";
          tr.setAttribute("data-src", r.src);
          var tdL = document.createElement("td");
          tdL.className = "lock";
          var a = document.createElement("a");
          a.href = r.src;
          a.textContent = r.lock;
          tdL.appendChild(a);
          var tdA = document.createElement("td");
          tdA.className = "add";
          var code = document.createElement("code");
          code.textContent = r.cmd;
          tdA.appendChild(code);
          var tdD = document.createElement("td");
          tdD.textContent = r.note;
          var tdP = document.createElement("td");
          tdP.className = "pay";
          tdP.textContent = r.pay || "free";
          var tdB = document.createElement("td");
          tdB.className = "cmd";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy";
          btn.textContent = "copy";
          btn.setAttribute("data-cmd", r.cmd);
          tdB.appendChild(btn);
          tr.appendChild(tdL);
          tr.appendChild(tdA);
          tr.appendChild(tdD);
          tr.appendChild(tdP);
          tr.appendChild(tdB);
          body.appendChild(tr);
          i = i + 1;
        }
      }

      body.addEventListener("click", function (ev) {
        var t = ev.target;
        if (!t) return;
        if (t.classList && t.classList.contains("copy")) {
          ev.preventDefault();
          ev.stopPropagation();
          copyText(t.getAttribute("data-cmd") || "", t);
          return;
        }
        if (t.tagName === "A") return;
        var tr = t.closest ? t.closest("tr.hit") : null;
        if (tr && tr.getAttribute("data-src")) location.href = tr.getAttribute("data-src");
      });
      q.addEventListener("input", function () {
        writeQuery(q.value.replace(/^\s+|\s+$/g, ""));
        draw();
      });

      Promise.all([
        fetch("catalog", { cache: "no-cache" }).then(function (r) {
          if (!r.ok) throw new Error("catalog");
          return r.text();
        }),
        fetch("yank", { cache: "no-cache" }).then(function (r) {
          return r.ok ? r.text() : "";
        }).catch(function () { return ""; })
      ]).then(function (pair) {
        yankedNames = parseYank(pair[1]);
        rows = parseCatalog(pair[0], yankedNames);
        return Promise.all(rows.map(function (row) {
          return fetch(row.name + "/manifest", { cache: "no-cache" }).then(function (r) {
            return r.ok ? r.text() : "";
          }).catch(function () { return ""; }).then(function (text) {
            var pay = "free";
            var lines = (text || "").split("\n");
            var j = 0;
            while (j < lines.length) {
              var line = lines[j];
              var eq = line.indexOf("=");
              if (eq > 0 && line.slice(0, eq) === "pay") {
                pay = line.slice(eq + 1);
              }
              j = j + 1;
            }
            if (!pay) pay = "free";
            row.pay = pay;
          });
        })).then(function () {
          loaded = true;
          q.value = queryFromUrl();
          draw();
        });
      }).catch(function () {
        loaded = true;
        rows = [];
        table.hidden = true;
        note("Could not load catalog.");
      });

      var key = "ooda-theme";
      function apply(t) {
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) b.textContent = t === "dark" ? "light" : "dark";
      }
      apply(document.documentElement.getAttribute("data-theme") || "light");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
    })();
  </script>
</body>
</html>
